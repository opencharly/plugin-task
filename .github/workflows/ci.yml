# The Go gates for this plugin's own module.
#
# The stock plugin repos carry no Go CI (their candies were thin); THIS one
# ships a real Go module with a vendored device client, so the rulebook's
# "tests that can fail" (R7) requires a gate that actually runs them:
# gofmt, the configured golangci-lint set, the formatter-class diff,
# go vet, and the unit tests (which drive a fake JetKVM device).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: candy/plugin-task/go.mod
          cache-dependency-path: candy/plugin-task/go.sum

      - name: gofmt
        working-directory: candy/plugin-task
        run: test -z "$(gofmt -l .)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: candy/plugin-task

      - name: go vet
        working-directory: candy/plugin-task
        run: go vet ./...

      - name: go test
        working-directory: candy/plugin-task
        run: go test ./...
